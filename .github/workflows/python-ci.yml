name: CI

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - setup.cfg
            - setup.py
            - tox.ini
            - "requirements/**"
            - "docs/**"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Requirements"]
        types: [completed]
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.14",
                          os: ubuntu-latest,
                          tox: py314,
                      }
        services:
            redis:
                image: redis
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: "requirements/*.txt"
            - name: install-utils
              run: uv tool install tox --with tox-uv
            - name: tests
              run: tox -e ${{ matrix.tox }}
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tox exec -e ${{ matrix.tox }} -- coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tox exec -e ${{ matrix.tox }} -- coverage xml
                  tox exec -e ${{ matrix.tox }} -- coverage html
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: |
                      htmlcov/
                      coverage.xml
            # Warn-only: continue-on-error means this never blocks a merge, only shows
            # as a flagged step. Reuses the .coverage data the tests step already wrote.
            - name: coverage-threshold
              continue-on-error: true
              run: tox exec -e ${{ matrix.tox }} -- coverage report --fail-under=79
            # Push-only: PR runs shouldn't write commits. Writes a shields.io
            # endpoint-schema JSON badge and commits it back so the README can reference
            # it via img.shields.io/endpoint. continue-on-error since a badge push racing
            # another push to the same branch is a rejected, not fatal, non-fast-forward.
            - name: coverage-badge
              if: github.event_name == 'push'
              continue-on-error: true
              run: |
                  PCT=$(tox exec -e ${{ matrix.tox }} -- coverage report --format=total)
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  mkdir -p .github/badges
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > .github/badges/coverage.json
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/coverage.json
                  git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
                  git push origin "HEAD:${{ github.ref_name }}"

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: "3.14"
            - name: install-deps
              run: uv pip install -r requirements/docs.txt
            - name: make-docs
              run: |
                  source .venv/bin/activate
                  cd docs && make html
            - name: publish-docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
