name: CI

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - setup.cfg
            - setup.py
            - tox.ini
            - "requirements/**"
            - "docs/**"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Requirements"]
        types: [completed]
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        concurrency: ci
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.14",
                          os: ubuntu-latest,
                          tox: py314,
                      }
        services:
            redis:
                image: redis
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: "requirements/*.txt"
            - name: install-utils
              run: uv tool install tox --with tox-uv
            - name: tests
              run: tox -e ${{ matrix.tox }}

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: "3.14"
            - name: install-deps
              run: uv pip install -r requirements/docs.txt
            - name: make-docs
              run: |
                  source .venv/bin/activate
                  cd docs && make html
            - name: publish-docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
