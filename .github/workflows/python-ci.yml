name: CI

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - pyproject.toml
            - uv.lock
            - "docs/**"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Lockfile"]
        types: [completed]
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.14",
                          os: ubuntu-latest,
                      }
        services:
            redis:
                image: redis
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
            - name: sync-deps
              run: uv sync --group test --frozen
            - name: tests
              run: uv run pytest -v tests
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage xml
                  uv run coverage html
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: |
                      htmlcov/
                      coverage.xml
            # Warn-only: continue-on-error means this never blocks a merge, only shows
            # as a flagged step. Reuses the .coverage data the tests step already wrote.
            - name: coverage-threshold
              continue-on-error: true
              run: uv run coverage report --fail-under=79
            # Written into a dir published below (docs job) rather than committed to
            # develop - a direct push there is rejected outright by this repo's PR-only
            # ruleset (found the hard way: continue-on-error silently absorbed the
            # rejection when this used to `git push`).
            - name: coverage-badge
              continue-on-error: true
              run: |
                  PCT=$(uv run coverage report --format=total | grep -E '^[0-9]+$' | tail -1)
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  mkdir -p badge
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > badge/coverage-badge.json
            - name: upload-coverage-badge-artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-badge
                  path: badge/coverage-badge.json
                  if-no-files-found: warn

    locale-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check for hardcoded user-facing template strings
              run: ./scripts/check-template-strings.sh
