name: PR

on:
    pull_request:
        branches: [develop, master]
        paths:
            - "src/**"
            - "tests/**"
            - setup.cfg
            - setup.py
            - tox.ini
            - "requirements/**"
            - "docs/**"
            - ".github/workflows/**"

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.14",
                          os: ubuntu-latest,
                          tox: py314,
                      }
        services:
            redis:
                image: redis
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v5
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: "requirements/*.txt"
            - name: install-utils
              run: uv tool install tox --with tox-uv
            - name: tests
              run: tox -e ${{ matrix.tox }}
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tox exec -e ${{ matrix.tox }} -- coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tox exec -e ${{ matrix.tox }} -- coverage xml
                  tox exec -e ${{ matrix.tox }} -- coverage html
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: |
                      htmlcov/
                      coverage.xml
            # Warn-only: continue-on-error means this never blocks a merge, only shows
            # as a flagged step. Reuses the .coverage data the tests step already wrote.
            - name: coverage-threshold
              continue-on-error: true
              run: tox exec -e ${{ matrix.tox }} -- coverage report --fail-under=79
