name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: sweetrpg/github-actions/.github/workflows/python-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # This repo manages dependencies with uv (pyproject.toml + uv.lock) - the reusable
      # workflow's pip-requirements defaults don't apply (there is no requirements/tests.txt).
      install-command: uv sync --group test
      test-command: uv run pytest tests
    secrets: inherit
