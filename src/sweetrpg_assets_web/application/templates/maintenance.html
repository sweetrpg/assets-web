<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweetRPG Assets - Maintenance</title>
  <link rel="icon" href="{{ favicon_url }}">
  <link rel="stylesheet" href="{{ url_for('web.static_asset', filename='css/maintenance.css') }}">
</head>
<body>
  <div class="container">
    <img src="{{ logo_url }}" alt="SweetRPG" class="logo">
    <h1>{{ label }}</h1>
    <p class="tagline">{{ description }}</p>

    <div class="info-box">
      <p>This service is temporarily unavailable for scheduled maintenance. Please check back shortly.</p>
      {% if window %}
        <p class="window">{{ window|safe }}</p>
      {% endif %}
    </div>
  </div>

  <footer>
    <span>&copy; 2026 Pilgrimage Software</span>
  </footer>
</body>
</html>
