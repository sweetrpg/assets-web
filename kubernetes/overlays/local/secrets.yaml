---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-auth
    namespace: sweetrpg-support

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-misc
    namespace: sweetrpg-support

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/support/assets/web/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-cache
    namespace: sweetrpg-support

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-cache
        creationPolicy: Owner
    dataFrom:
        # /sweetrpg/support/cache/client and /sweetrpg/support/cache/auth currently resolve to
        # the same Akeyless secret content, but /auth is the standardized path used by
        # support/common/cache's own redis-auth secret - matching it here rather than relying
        # on the two paths staying in sync (catalog-api hit exactly this kind of stale-alias
        # drift once already, see catalog-api#125).
        - extract:
              key: /sweetrpg/support/cache/auth

