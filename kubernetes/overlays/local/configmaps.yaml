---
apiVersion: v1
kind: ConfigMap

metadata:
    name: assets-web-env

data:
    PORT: "8081"
    SERVICE_CHECK_URL: http://dev.sweetrpg.com/health/ping
    HEALTH_CHECK_URL: http://dev.sweetrpg.com/health/status
    APPLICATION_BASE_PATH: ""
    BUILD_INFO_PATH: /app/build-info.json
    SERVICE_REGISTRATION_URL: "http://consul.sweetrpg-support.svc.cluster.local:1234"
    ASSET_DATA_PATH: /data
    # Same collector the catalog services export to (tempo-distributor's OTLP/HTTP receiver).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318
    # Requests per minute, one shared process-wide bucket - a blunt backstop, not per-client.
    RATE_LIMIT: "120/minute"
