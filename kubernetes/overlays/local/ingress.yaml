---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: assets-web-v1
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
        traefik.ingress.kubernetes.io/router.middlewares: sweetrpg-support-strip-prefix-assets@kubernetescrd
        kubernetes.io/ingress.class: traefik
        # TLS is terminated once, upstream, by the Tailscale Kubernetes operator's Ingress in
        # support/config/K8s/traefik/overlays/minikube (traefik-tailscale) - this hop is plain
        # HTTP inside the cluster, no cert-manager/websecure annotations needed here.

spec:
    ingressClassName: traefik
    rules:
        - host: sweetrpg-local.curlew-smoot.ts.net
          http:
              paths:
                  - pathType: Prefix
                    path: /assets
                    backend:
                        service:
                            name: assets-web-v1
                            port:
                                name: http
