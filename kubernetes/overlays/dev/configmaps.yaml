---
apiVersion: v1
kind: ConfigMap

metadata:
    name: web-env

data:
    PORT: "8081"
    SERVICE_CHECK_URL: http://dev.sweetrpg.com/health/ping
    HEALTH_CHECK_URL: http://dev.sweetrpg.com/health/status
    # Traefik's strip-prefix-web Middleware removes /assets before this app sees the request -
    # PrefixMiddleware (main.py) re-adds it to every url_for()-generated link so they round-trip
    # back through the Ingress correctly.
    APPLICATION_BASE_PATH: /assets
    BUILD_INFO_PATH: /app/build-info.json
    SERVICE_REGISTRATION_URL: "http://consul.sweetrpg-support.svc.cluster.local:1234"
    ASSET_DATA_PATH: /data
    ROOT_URL: https://dev.sweetrpg.com/
    SHARED_URL: https://dev.sweetrpg.com/
    # Same collector the catalog services export to (tempo-distributor's OTLP/HTTP receiver).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318
    # Requests per minute, one shared process-wide bucket - a blunt backstop, not per-client.
    RATE_LIMIT: "120/minute"
    ENV: dev
    # Shared suite-wide login session (auth-web's own dedicated Redis instance) - see
    # docs/frontend-conventions.md's "Shared session schema" in sweetrpg/platform.
    SHARED_SESSION_REDIS_HOST: cache.sweetrpg-auth.svc.cluster.local
    SHARED_SESSION_REDIS_DB: "0"
    # Cross-namespace edit-session store (durable-volume-editing) - see
    # docs/frontend-conventions.md's "Edit session schema" in sweetrpg/platform.
    EDIT_SESSION_REDIS_HOST: cache.sweetrpg-catalog.svc.cluster.local
    EDIT_SESSION_REDIS_DB: "2"
    CATALOG_API_URL: http://api-v1.sweetrpg-catalog.svc.cluster.local:8000
    # Auth0 tenant for validating forwarded user bearer tokens (bearer_token.py) - the
    # service-to-service asset-store path (catalog-api promoting staged covers/samples) has no
    # browser session cookie. Same tenant/audience auth-api verifies against (api-misc secret).
    AUTH0_DOMAIN: sweetrpg-dev.us.auth0.com
    AUTH0_AUDIENCE: https://sweetrpg.com/api/
