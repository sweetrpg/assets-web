---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-support

resources:
    - ../../base
    - configmaps.yaml
    - hpa.yaml
    - pdb.yaml
    - destination-rules.yaml
    - secrets.yaml
patchesStrategicMerge:
    - replicas.yaml

commonLabels:
    app: main-assets
    version: v1
    platform: sweetrpg
    package: main
    component: assets

generatorOptions:
    disableNameSuffixHash: true
