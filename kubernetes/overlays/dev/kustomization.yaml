---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-assets

resources:
    - ../../base
    - configmaps.yaml
    - secrets.yaml
    - podmonitor.yaml
    - ingress.yaml
    - middlewares.yaml
    - pvc.yaml

labels:
  - pairs:
      app: assets
      version: v1
      platform: sweetrpg
      package: assets
      component: web

generatorOptions:
    disableNameSuffixHash: true
