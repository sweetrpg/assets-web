---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-support

resources:
    - namespace.yaml
    - ../../base
    - configmaps.yaml
patchesStrategicMerge:
    - replicas.yaml

commonLabels:
    platform: sweetrpg
    app: sweetrpg-assets-web-v1
    package: assets
    component: web
    version: v1

generatorOptions:
    disableNameSuffixHash: true
