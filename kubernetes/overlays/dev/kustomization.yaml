---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-assets

resources:
    - ../../base
    - configmaps.yaml
    - secrets.yaml
    - ingress.yaml
    - middlewares.yaml
    - pvc.yaml
    - pod-monitor.yaml

labels:
  - pairs:
      app: web
      version: v1
      platform: sweetrpg
      package: assets
      component: web

generatorOptions:
    disableNameSuffixHash: true

images:
  - name: assets-web
    newName: ghcr.io/sweetrpg/assets-web
    newTag: v0.0.1
