---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: assets-web-v1
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: sweetrpg-support-strip-prefix-assets@kubernetescrd
        kubernetes.io/ingress.class: traefik
        cert-manager.io/cluster-issuer: letsencrypt-prd
        # catalog-web's Ingress already owns the ExternalDNS hostname/target annotations for
        # dev.sweetrpg.com - deliberately not repeating them here (see that Ingress's own
        # comment): ExternalDNS ownership conflicts if more than one Ingress for the same host
        # sets them.

spec:
    ingressClassName: traefik
    rules:
        - host: dev.sweetrpg.com
          http:
              paths:
                  - pathType: Prefix
                    path: /assets
                    backend:
                        service:
                            name: assets-web-v1
                            port:
                                name: http
    tls:
        - hosts:
              - dev.sweetrpg.com
          # Shared secretName across every frontend's Ingress for this host - see catalog-web's
          # Ingress comment for why this must match exactly.
          secretName: sweetrpg-dev-tls
