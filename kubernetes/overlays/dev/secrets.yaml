---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-auth
    namespace: sweetrpg-assets

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-misc
    namespace: sweetrpg-assets

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/assets/web/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-cache
    namespace: sweetrpg-assets

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-cache
        creationPolicy: Owner
    dataFrom:
        # This app's own dedicated Redis instance in sweetrpg-assets (support/common/cache) -
        # /auth is the standardized path used by that module's own redis-auth secret; match it
        # here rather than relying on a separate alias staying in sync (catalog-api hit exactly
        # this kind of stale-alias drift once already, see catalog-api#125).
        - extract:
              key: /sweetrpg/assets/cache/auth

