---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-auth
    namespace: sweetrpg-assets

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-misc
    namespace: sweetrpg-assets

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/assets/web/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-cache
    namespace: sweetrpg-assets

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-cache
        creationPolicy: Owner
    dataFrom:
        # This app's own dedicated Redis instance in sweetrpg-assets (support/common/cache) -
        # /auth is the standardized path used by that module's own redis-auth secret; match it
        # here rather than relying on a separate alias staying in sync (catalog-api hit exactly
        # this kind of stale-alias drift once already, see catalog-api#125).
        - extract:
              key: /sweetrpg/assets/cache/auth

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-shared-session
    namespace: sweetrpg-assets

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-shared-session
        creationPolicy: Owner
    dataFrom:
        # auth-web's own Redis instance requires auth - same Akeyless path its own redis-auth
        # ExternalSecret reads (sweetrpg-auth namespace), and the same pattern catalog-web's
        # own shared-session secret uses. Renamed from REDIS_PASS to SHARED_SESSION_REDIS_PASS
        # on the way in so it doesn't collide with this app's own cache Redis credentials
        # above - shared_session.py reads SHARED_SESSION_REDIS_PASS for the shared session
        # Redis specifically. This secret never existed here before, so shared_session.py's
        # Redis connection always sent no password against a Redis that requires one
        # (AuthenticationError), meaning current_user() always failed and every visitor read
        # as logged-out - including for the authenticated cover-upload POST.
        - extract:
              key: /sweetrpg/auth/cache/auth
          rewrite:
              - regexp:
                    source: "REDIS_PASS"
                    target: "SHARED_SESSION_REDIS_PASS"

