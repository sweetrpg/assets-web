---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-auth
    namespace: sweetrpg-support

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-misc
    namespace: sweetrpg-support

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/support/assets/web/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-cache
    namespace: sweetrpg-support

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/support/cache/client

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: assets-web-files
    namespace: sweetrpg-support

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: assets-web-files
        creationPolicy: Owner
        template:
            type: Opaque
            data:
                newrelic.ini: "{{ .contents | toString }}"
    data:
        - secretKey: contents
          remoteRef:
              key: NewRelic
